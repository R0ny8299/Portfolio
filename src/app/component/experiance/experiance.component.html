<section id="experience" class="py-5 bg-light" style="background-image: url('assets/images/A3.jpg')">
  <div class="container" >
    <h3 class="text-center mb-5 title">Work Experience</h3>
    <div class="timeline position-relative">

      <div *ngFor="let exp of workexp" class="timeline-item mb-5 position-relative">
        <div class="timeline-dot position-absolute top-0 start-50 translate-middle-x rounded-circle bg-primary"></div>
        <div class="timeline-content ms-5">
          <h5 class="fw-bold">{{ exp.role }} <span class="text-muted">- {{ exp.company }}</span></h5>
          <p class="mb-1 text-muted">{{ exp.timeline }}, {{ exp.location }}</p>
          <ul class="mb-0">
            <li *ngFor="let w of exp.work.split('|')" class="mb-1">{{ w }}</li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</section>
